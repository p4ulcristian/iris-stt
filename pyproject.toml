[project]
name = "iris-comms"
version = "0.1.0"
description = "Iris speech-to-text + text-to-speech HTTP API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.3",
    "flask-cors>=6.0.2",
    "numpy>=2.4.3",
    "resampy>=0.4.3",
    "soundfile>=0.13.1",
    "torch>=2.10.0",
    "nemo_toolkit[asr]",
    "chatterbox-tts>=0.1.7",
    "transformers>=4.46.0",
    "diffusers>=0.29.0",
    "librosa>=0.10.0",
    "s3tokenizer>=0.1.7",
    "conformer>=0.3.2",
    "omegaconf>=2.3.0",
    "pyloudnorm>=0.1.1",
    "resemble-perth>=1.0.1",
    "peft>=0.13.0",
    "safetensors>=0.4.5",
    "accelerate>=1.1.0",
]

[tool.uv]
# The Nix-built python in ~/.nix-profile links a private glibc that cannot load
# the system NVIDIA driver (libcuda.so) -> "CUDA error: unknown error" at load.
# Always use a uv-managed CPython, which links the system glibc.
python-preference = "only-managed"
# chatterbox-tts hard-pins torch==2.6.0, which has no sm_120 (RTX 50-series)
# kernels, plus transformers==5.2.0 that NeMo cannot use. Override those pins
# with the versions this project already runs, and drop its demo-only deps
# (gradio UI, Japanese/Chinese text segmenters for the multilingual model).
override-dependencies = [
    "torch>=2.10.0",
    "torchaudio>=2.10.0",
    "transformers>=4.46.0,<5",
    "diffusers>=0.29.0",
    "safetensors>=0.4.5",
    "numpy>=2",
    "gradio; sys_platform == 'never'",
    "pykakasi; sys_platform == 'never'",
    "spacy-pkuseg; sys_platform == 'never'",
]
