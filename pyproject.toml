[project]
name = "iris-stt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "flask-cors>=6.0.2",
    "numpy>=2.4.3",
    "resampy>=0.4.3",
    "soundfile>=0.13.1",
    "torch>=2.10.0",
    "nemo_toolkit[asr]",
    "openwakeword>=0.4.0",
    "onnxruntime>=1.26.0",
    # Chatterbox's transitive deps — listed here so they are managed by uv/pip,
    # but `chatterbox-tts` itself is installed separately with --no-deps because
    # it hard-pins torch==2.6.0, which would clobber the sm_120 (Blackwell)
    # cu128 wheels required for RTX 50-series. See requirements-tts.txt.
    "transformers>=4.46.0",
    "diffusers>=0.29.0",
    "librosa>=0.10.0",
    "s3tokenizer>=0.1.7",
    "conformer>=0.3.2",
    "omegaconf>=2.3.0",
    "pyloudnorm>=0.1.1",
    "resemble-perth>=1.0.1",
    "peft>=0.13.0",
    "safetensors>=0.4.5",
    "accelerate>=1.1.0",
]
